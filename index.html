<style>
  /* scenic-wrap needs explicit height when used inside flex/grid */
  .scenic-wrap { display: block; }
  .scenic-wrap .ph-img { transition: transform 0.7s cubic-bezier(0.16,1,0.3,1); }

  /* responsive tweaks for the SPA chrome */
  @media (max-width: 1080px) {
    .listing-body { grid-template-columns: 1fr !important; }
    .filters-side { position: static !important; }
    .detail-body, .booking-grid, .profile-grid, .why-grid { grid-template-columns: 1fr !important; }
    .book-aside, .order-summary { position: static !important; }
    .dest-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }
  @media (max-width: 920px) {
    .grid-3 { grid-template-columns: repeat(2, 1fr) !important; }
    .hero-search { grid-template-columns: 1fr 1fr !important; }
    .hero-search > button { grid-column: span 2; }
    .cat-strip { grid-template-columns: repeat(3, 1fr) !important; }
    .auth-wrap { grid-template-columns: 1fr !important; }
    .auth-art { display: none; }
  }
  @media (max-width: 720px) {
    .desk-nav { display: none !important; }
    .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
    .hero-search { grid-template-columns: 1fr !important; }
    .hero-search > button { grid-column: span 1; }
    .cat-strip { grid-template-columns: repeat(2, 1fr) !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
    .footer-bottom { flex-direction: column; gap: 12px; }
    .step-label { display: none; }
    .gallery { grid-template-columns: 1fr !important; grid-template-rows: auto !important; }
    .gallery > *:not(:first-child) { display: none; }
    .search-label { display: inline; }
    .wrap { padding: 0 18px; }
  }
  /* ---- Boot screen: a little journey while the site loads ---- */
  #boot {
    position: fixed; inset: 0; z-index: 999;
    display: grid; place-items: center;
    background: radial-gradient(130% 130% at 50% 18%, oklch(0.30 0.06 235) 0%, oklch(0.17 0.045 235) 55%, oklch(0.11 0.03 235) 100%);
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  #boot.gone { opacity: 0; pointer-events: none; visibility: hidden; }
  .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: bootIn 0.8s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes bootIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  .boot-globe { position: relative; width: 88px; height: 88px; }
  .boot-globe::before { /* the globe */
    content: ''; position: absolute; inset: 12px; border-radius: 50%;
    border: 2px solid oklch(1 0 0 / 0.28);
    background: radial-gradient(circle at 32% 32%, oklch(0.74 0.09 196 / 0.4), transparent 62%);
    box-shadow: 0 0 34px oklch(0.66 0.11 222 / 0.35), inset 0 0 18px oklch(0.66 0.11 222 / 0.25);
  }
  .boot-globe::after { /* meridian */
    content: ''; position: absolute; inset: 12px; border-radius: 50%;
    border: 1px solid oklch(1 0 0 / 0.14); transform: scaleX(0.52);
  }
  .boot-orbit { position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed oklch(1 0 0 / 0.25); animation: spinSlow 3.2s linear infinite; }
  .boot-orbit::before { /* the traveller */
    content: ''; position: absolute; top: -5px; left: 50%; margin-left: -5px;
    width: 10px; height: 10px; border-radius: 50%;
    background: oklch(0.72 0.14 38);
    box-shadow: 0 0 16px 4px oklch(0.72 0.14 38 / 0.55);
  }
  .boot-word { font-family: "Instrument Serif", Georgia, serif; font-size: 2.1rem; color: white; line-height: 1; }
  .boot-word em { font-style: italic; color: oklch(0.9 0.05 80); }
  .boot-sub { font-family: "Manrope", system-ui, sans-serif; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; color: oklch(1 0 0 / 0.5); margin-top: -12px; }
  .boot-bar { width: 178px; height: 3px; border-radius: 99px; background: oklch(1 0 0 / 0.12); overflow: hidden; }
  .boot-bar span { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, oklch(0.66 0.11 222), oklch(0.74 0.09 196), oklch(0.72 0.14 38)); animation: bootSlide 1.15s ease-in-out infinite; }
  @keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(460%); } }
  .boot-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: white; opacity: 0.35; animation: bootTwinkle 2.6s ease-in-out infinite; }
  @keyframes bootTwinkle { 50% { opacity: 0.95; transform: scale(1.5); } }
  /* small spinner reused inside the app (admin session check) */
  .boot-mark { width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(var(--ocean-bright), var(--teal), var(--coral), var(--ocean-bright)); animation: spinSlow 1.1s linear infinite; -webkit-mask: radial-gradient(farthest-side, transparent 60%, #000 62%); mask: radial-gradient(farthest-side, transparent 60%, #000 62%); }

<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp } = React;

/* ---- tiny hash router: #/view/param ---- */
function parseHash() {
  const h = (location.hash || "#/").replace(/^#\/?/, "");
  const [seg, param] = h.split("/");
  if (!seg) return { view: "home" };
  if (seg === "journeys" || seg === "listing") return { view: "listing" };
  if (seg === "tour" && param) return { view: "tour", id: param };
  if (seg === "booking" && param) return { view: "booking", id: param };
  if (seg === "account") return { view: "account", tab: param };
  if (seg === "admin")   return { view: "admin" };
  if (seg === "reset-password") return { view: "account", resetPassword: true };
  return { view: "home" };
}

function routeToHash(r) {
  const map = { home: "#/", listing: "#/journeys", tour: "#/tour/" + (r.id || ""), booking: "#/booking/" + (r.id || ""), account: "#/account" + (r.tab ? "/" + r.tab : ""), admin: "#/admin" };
  return map[r.view] || "#/";
}

function App() {
  const [route, setRoute] = useStateApp(() => {
    // Restore the richer stored route (with transient params like travellers)
    // only when it matches the current hash — otherwise the URL wins, so
    // shared/bookmarked links always open the right page.
    try {
      const s = sessionStorage.getItem("lumina_route");
      if (s) {
        const r = JSON.parse(s);
        if (routeToHash(r) === (location.hash || "#/")) return r;
      }
    } catch (e) {}
    return parseHash();
  });
  const [store, setStore] = useStateApp(Store.get());

  useEffectApp(() => Store.subscribe((s) => setStore({ ...s })), []);

  useEffectApp(() => {
    const b = document.getElementById("boot");
    if (!b) return;
    /* Keep the branded boot screen up for at least 2s from page open.
       performance.now() counts from navigation start, so a slow load
       hides it immediately once the app is ready — no double wait. */
    const MIN_BOOT_MS = 2000;
    const delay = Math.max(0, MIN_BOOT_MS - performance.now());
    const t = setTimeout(() => b.classList.add("gone"), delay);
    return () => clearTimeout(t);
  }, []);

  const go = (r) => {
    setRoute(r);
    try { sessionStorage.setItem("lumina_route", JSON.stringify(r)); } catch (e) {}
    const h = routeToHash(r);
    // pushState (not replaceState) so the browser back button works
    if (h !== location.hash) history.pushState(null, "", h);
    if (r.hash) {
      setTimeout(() => {
        const el = document.getElementById(r.hash);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 150);
    } else {
      window.scrollTo(0, 0);
    }
  };

  // sync browser back/forward (covers both pushState and manual hash edits)
  useEffectApp(() => {
    const onNav = () => setRoute(parseHash());
    window.addEventListener("popstate", onNav);
    window.addEventListener("hashchange", onNav);
    return () => { window.removeEventListener("popstate", onNav); window.removeEventListener("hashchange", onNav); };
  }, []);

  const showChrome = (route.view !== "account" || store.user) && route.view !== "admin";
  const hideFooter = route.view === "booking" || route.view === "admin" || (route.view === "account" && !store.user);

  return (
    <ToastProvider>
      {showChrome && <Nav go={go} route={route} savedCount={store.saved.length} user={store.user} />}
      <main key={route.view + (route.id || "") + (route.tab || "")}>
        {route.view === "home" && <HomePage go={go} />}
        {route.view === "listing" && <ListingPage go={go} route={route} />}
        {route.view === "tour" && <TourPage go={go} route={route} />}
        {route.view === "booking" && <BookingPage go={go} route={route} />}
        {route.view === "account" && <AccountPage go={go} route={route} store={store} />}
        {route.view === "admin"   && <AdminPage go={go} store={store} />}
      </main>
      {showChrome && !hideFooter && <Footer go={go} />}
      {showChrome && <FloatContact />}
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LangThemeProvider><ErrorBoundary><App /></ErrorBoundary></LangThemeProvider>);
</script>
